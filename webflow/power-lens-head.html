<script type="application/json" id="power-lens-data">{"edition_id":"2026-11-09","as_of":"2026-11-09","methodology_id":"ai-power-rankings-1.0.0","change_note":"November 9 review of all 50 companies. Deployed compute, enterprise controls and scarce power infrastructure strengthen selected scores; external cloud dependence tempers frontier-lab Energy forecasts. Same cohort and locked methodology. September is preserved; no October edition is backfilled. The 2026 assessment advances to November 9; 2027 and 2030 forecast target dates remain September 18.","rows":[["alphabet","Alphabet",[[1,95,[100,100,90,70],"current_assessment","2026-11-09"],[1,96.9,[100,100,95,80],"forecast","2027-09-18"],[1,98.1,[100,100,95,90],"forecast","2030-09-18"]],"Alphabet reports Q3 Google Cloud revenue of $30.7 billion, up 103%, with TPU systems sales contributing. Search revenue grew 12%.","Compute rises to 100: deployed cloud scale and external TPU commercialization strengthen the infrastructure bottleneck. Interface was already at 100. Future OCI TPU deployments do not add current Energy credit.","Agents displace Google’s discovery surfaces faster than Gemini captures the new interaction.",[{"title":"Alphabet Q3 2026 results","url":"https://www.sec.gov/Archives/edgar/data/1652044/000165204426000080/googexhibit991q32026.htm","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["microsoft","Microsoft",[[2,92.5,[95,95,95,75],"current_assessment","2026-11-09"],[2,96.3,[95,100,95,80],"forecast","2027-09-18"],[2,98.1,[95,100,100,90],"forecast","2030-09-18"]],"Microsoft reports Azure revenue of $33.2 billion, up 48%, and Microsoft Cloud growth of 30% in the September quarter.","Compute rises to 95 as operating Azure capacity and adoption substantiate more of the platform position. Existing enterprise Interface and Alignment judgments hold; revenue growth alone does not establish greater electricity control.","Customers move their agent orchestration and identities outside Microsoft’s products.",[{"title":"Microsoft FY2027 Q1 results","url":"https://www.microsoft.com/en-us/Investor/earnings/FY-2027-Q1/press-release-webcast","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["amazon","Amazon",[[3,91.9,[95,90,90,80],"current_assessment","2026-11-09"],[3,96.3,[100,90,95,85],"forecast","2027-09-18"],[3,97.5,[100,95,95,90],"forecast","2030-09-18"]],"Amazon reports AWS Q3 revenue of $46.0 billion, up 39%, and operating income of $17.8 billion.","All inputs hold. Strong operating evidence reinforces the already high Compute score; faster revenue growth is not a separate force or an automatic upgrade.","Custom-chip commitments fail to convert into useful capacity or customers bypass AWS’s agent layer.",[{"title":"Amazon Q3 2026 results","url":"https://www.aboutamazon.com/news/company-news/amazon-earnings-q3-2026-report","date_label":"Q3 2026 results; accessed 2026-11-09","accessed_on":"2026-11-09"}]],["openai","OpenAI",[[4,88.8,[85,100,80,45],"current_assessment","2026-11-09"],[4,92.5,[95,100,85,60],"forecast","2027-09-18"],[4,95.6,[95,100,95,75],"forecast","2030-09-18"]],"OpenAI reports more than 1.2 billion weekly ChatGPT users and availability of ChatGPT Enterprise through AWS Marketplace. Its October Google Cloud announcement plans model availability in coming weeks.","Current Interface rises to 100 for direct reach and procurement distribution. We temper forecast infrastructure sovereignty: cloud purchasing and partnerships provide access, not ownership of suppliers or their electricity. This revises the September forecast, not observed capacity.","Direct user and enterprise adoption stalls, or external compute and firm-power delivery fails to convert contracted access into reliable capacity. Verified control of more energized infrastructure would support higher forecasts.",[{"title":"ChatGPT Enterprise in AWS Marketplace","url":"https://openai.com/index/chatgpt-enterprise-aws-marketplace/","date_label":"2026-11-09","accessed_on":"2026-11-09"},{"title":"OpenAI models coming to Google Cloud","url":"https://openai.com/index/openai-models-google-cloud/","date_label":"2026-10-21; availability prospective","accessed_on":"2026-11-09"}]],["meta","Meta",[[5,86.9,[90,95,65,65],"current_assessment","2026-11-09"],[5,88.8,[95,95,70,70],"forecast","2027-09-18"],[5,91.3,[95,95,80,80],"forecast","2030-09-18"]],"Meta reports 3.64 billion daily active people, launches of Muse and Muse Wonder, and $34.91 billion of quarterly capital expenditure. Its $135–145 billion annual capex range is guidance.","All inputs hold. Distribution remains a major strength; model launches and planned spending do not by themselves demonstrate a new five-point step in control.","Meta turns messaging into the dominant environment for commercial agent transactions.",[{"title":"Meta Q3 2026 results","url":"https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Third-Quarter-2026-Results/","date_label":"2026-10-21","accessed_on":"2026-11-09"}]],["nvidia","NVIDIA",[[6,85.6,[100,90,65,30],"current_assessment","2026-11-09"],[7,86.9,[100,90,70,35],"forecast","2027-09-18"],[11,85.6,[95,90,75,45],"forecast","2030-09-18"]],"NVIDIA announced an independent board inquiry following reporting concerning its CEO. The board stated it had no reason to believe national security or company secrets had been compromised and retained confidence in leadership.","All inputs hold. The inquiry is an unresolved risk, not a finding of lost Compute control. Alignment measures authority over AI actions, not executive reputation. Reassess if findings change export access, operating leadership, or enforceable controls.","The board inquiry produces verified findings that impair export access, operational continuity, or enforceable controls; or alternative compute stacks erode customer dependence faster than forecast.",[{"title":"NVIDIA board statement","url":"https://nvidianews.nvidia.com/news/statement-from-nvidia-board-of-directors?embed=true","date_label":"2026-11-08","accessed_on":"2026-11-09"}]],["apple","Apple",[[7,84.4,[65,100,90,20],"current_assessment","2026-11-09"],[9,85.6,[70,100,90,25],"forecast","2027-09-18"],[12,83.8,[75,95,90,30],"forecast","2030-09-18"]],"Apple expanded Siri AI beta to additional languages with personal context, onscreen awareness and systemwide app actions. Regional restrictions and daily limits remain.","Current Alignment rises to 90 for OS-mediated access to personal context and actions. Interface remains at its existing maximum. The 2027 Alignment forecast rises to 90; this is authority over execution, not a claim that beta reliability is solved.","Siri becomes the default agent for most device actions, preserving Apple’s maximum interface position.",[{"title":"Siri AI language and action availability","url":"https://www.apple.com/newsroom/2026/10/siri-ai-is-available-in-more-languages-starting-today/","date_label":"2026-10-26","accessed_on":"2026-11-09"}]],["huawei","Huawei",[[8,81.3,[90,80,75,45],"current_assessment","2026-11-09"],[11,83.8,[90,85,80,55],"forecast","2027-09-18"],[7,90,[95,90,85,70],"forecast","2030-09-18"]],"Huawei reports over 1,000 deployed Atlas 900 A3 SuperPoDs and large-scale commercial use of Atlas 950. Ascend 960 variants remain scheduled for 2027.","Current Compute rises to 90 for disclosed commercial deployment and a broader software ecosystem. Existing 2027 and 2030 scores already anticipate an alternative stack; no credit is assigned for unshipped roadmap hardware.","Manufacturing limits or weak developer adoption prevent Ascend from becoming a durable alternative.",[{"title":"Huawei compute deployment and roadmap","url":"https://www.huawei.com/en/news/2026/9/hc-wang-keynote","date_label":"HUAWEI CONNECT September 2026","accessed_on":"2026-11-09"}]],["bytedance","ByteDance",[[9,80.6,[80,95,55,35],"current_assessment","2026-11-09"],[12,82.5,[85,95,60,40],"forecast","2027-09-18"],[15,81.3,[85,90,65,50],"forecast","2030-09-18"]],"ByteDance Seed lists Seedream 5.5 alongside Dola, Dreamina and BytePlus distribution. Its portfolio spans models, consumer creation and enterprise delivery.","All inputs hold. Additional model releases reinforce breadth but do not establish a new step in infrastructure, permission or electricity control.","Agent products capture enterprise permissions at the same scale as its consumer products capture attention.",[{"title":"ByteDance Seed product portfolio","url":"https://seed.bytedance.com/en/","date_label":"Current product page; Seedream 5.5 dated 2026-11-09","accessed_on":"2026-11-09"}]],["oracle","Oracle",[[10,80.6,[85,70,85,65],"current_assessment","2026-11-09"],[6,88.8,[95,75,85,75],"forecast","2027-09-18"],[6,90.6,[95,80,90,80],"forecast","2030-09-18"]],"Oracle and Google announced TPUs on OCI starting in calendar 2027, ramping over multiple years. OCI supplies datacenter power, cooling and networking.","Forecast Compute rises to 95 in 2027 and 2030 for a more diversified accelerator offering. Current scores hold; the future TPU service is not current capacity and does not transfer Google silicon ownership.","Large AI customers internalize capacity or fail to meet commitments.",[{"title":"Google TPUs on OCI: 2027 availability","url":"https://www.oracle.com/news/announcement/ai-world-oracle-brings-google-tpus-to-oracle-cloud-infrastructure-2026-10-27/","date_label":"2026-10-27","accessed_on":"2026-11-09"}]],["tencent","Tencent",[[11,78.8,[70,90,75,35],"current_assessment","2026-11-09"],[14,80.6,[75,90,80,40],"forecast","2027-09-18"],[13,83.1,[80,90,85,50],"forecast","2030-09-18"]],"Tencent describes WorkBuddy and CodeBuddy subscriptions, Hy model services and a prototype Xiaowei agent embedded in Weixin.","All inputs hold. Weixin distribution remains powerful; a prototype is not full deployment of permissioned transactions across that user base.","Commercial agents bypass Tencent’s interaction and transaction environment.",[{"title":"Tencent October company disclosure","url":"https://ww ked into competing stacks.",[{"title":"AMD Q3 2026 results","url":"https://newsroom.amd.com/news/amd-reports-third-quarter-2026-earnings/","date_label":"2026-11-03","accessed_on":"2026-11-09"}]],["ibm","IBM",[[21,67.5,[55,60,80,25],"current_assessment","2026-11-09"],[29,67.5,[55,60,80,25],"forecast","2027-09-18"],[44,63.1,[50,55,75,25],"forecast","2030-09-18"]],"IBM reports accelerated growth led by Software and Infrastructure and describes customer adoption of AI in operating workflows.","All inputs hold. The hybrid enterprise position remains meaningful, but current earnings do not disprove the longer-term competitive pressure embedded in the forecast.","Its hybrid governance becomes the default across heterogeneous AI environments.",[{"title":"IBM Q3 2026 results","url":"https://newsroom.ibm.com/2026-10-21-IBM-RELEASES-THIRD-QUARTER-RESULTS","date_label":"2026-10-21","accessed_on":"2026-11-09"}]],["databricks","Databricks",[[22,66.9,[40,65,85,5],"current_assessment","2026-11-09"],[27,68.8,[45,75,85,5],"forecast","2027-09-18"],[19,73.8,[50,80,90,10],"forecast","2030-09-18"]],"Databricks made AI Functions Unity Catalog permissions and default OAuth clients for external agents generally available, alongside gateway usage controls. Other catalog features remain beta.","Current Alignment rises to 85 for documented permissions applied to AI execution. Other forces and forecasts hold; a usage dashboard alone would not warrant this upgrade.","Open standards or cloud-native catalogs displace its authority over AI execution.",[{"title":"Databricks October product release notes","url":"https://docs.databricks.com/aws/en/release-notes/product/2026/october","date_label":"October 2026 release notes; updated 2026-11-04","accessed_on":"2026-11-09"}]],["asml","ASML",[[23,66.3,[100,20,10,0],"current_assessment","2026-11-09"],[30,66.3,[100,20,10,0],"forecast","2027-09-18"],[35,66.3,[100,20,10,0],"forecast","2030-09-18"]],"ASML reports record Q3 sales and expects planned 2027–2028 supply to fall short of customer demand.","All inputs hold. The evidence reinforces the existing 100 Compute anchor; customer demand and future orders do not grant broad AI permission authority.","Customers achieve comparable leading-edge production with materially less dependence on ASML.",[{"title":"ASML Q3 2026 results","url":"https://www.investor.asml.com/news-releases/news-release-details/asml-reports-eu11.7-billion-total-net-sales-and-eu5.0-billion-net-income-q3-2026","date_label":"2026-10-14","accessed_on":"2026-11-09"}]],["sap","SAP",[[24,66.3,[20,80,85,5],"current_assessment","2026-11-09"],[21,69.4,[20,80,90,5],"forecast","2027-09-18"],[21,73.1,[25,80,95,5],"forecast","2030-09-18"]],"SAP reports cloud ERP Suite revenue growth of 29% and continued customer adoption of its Business AI and Joule Work strategy.","All inputs hold. Strong ERP adoption reinforces authority over business records and transactions, but does not independently establish a new five-point force step.","Customers move authoritative business actions and permissions outside SAP.",[{"title":"SAP Q3 2026 results","url":"https://news.sap.com/2026/10/sap-announces-q3-2026-results/","date_label":"2026-10-21","accessed_on":"2026-11-09"}]],["broadcom","Broadcom",[[25,65.6,[90,35,35,5],"current_assessment","2026-11-09"],[20,69.4,[95,40,35,5],"forecast","2027-09-18"],[25,71.3,[95,45,45,5],"forecast","2030-09-18"]],"A $63 billion financing structure supports Broadcom accelerators and networking to be leased to Anthropic, with deliveries expected from 2027 and residual-value support from Broadcom.","All force scores hold. The arrangement strengthens the existing 95 forecast Compute call, while creating financing exposure. A funding structure is not shipped hardware or customer ownership.","Hyperscalers internalize chip design and networking value faster than Broadcom expands.",[{"title":"Broadcom compute financing: primary partner disclosure","url":"https://newsroom.bankofamerica.com/content/newsroom/press-releases/2026/10/bank-of-america--blackstone--citi-and-morgan-stanley-announce-la","date_label":"2026-10-26","accessed_on":"2026-11-09"}]],["servicenow","ServiceNow",[[26,65,[15,80,85,0],"current_assessment","2026-11-09"],[25,68.8,[20,80,90,0],"forecast","2027-09-18"],[22,72.5,[20,85,95,0],"forecast","2030-09-18"]],"ServiceNow reports $3.988 billion of subscription revenue and raises its 2026 AI annual contract value target to $1.7 billion. Its Control Tower strategy remains central.","Current Interface rises to 80 for enterprise workflow adoption. Alignment stays at 85 until broader evidence shows increased enforcement authority. The AI ACV target is guidance, not current recognized revenue.","The control layer remains a reporting dashboard while other platforms enforce permissions.",[{"title":"ServiceNow Q3 2026 results","url":"https://newsroom.servicenow.com/press-releases/details/2026/ServiceNow-Reports-Third-Quarter-2026-Financial-Results/default.aspx","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["coreweave","CoreWeave",[[27,65,[80,35,30,55],"current_assessment","2026-11-09"],[18,71.9,[85,45,35,70],"forecast","2027-09-18"],[28,69.4,[80,40,45,70],"forecast","2030-09-18"]],"CoreWeave schedules Q3 results for November 10, after this edition cutoff, and describes its specialized cloud as serving nine of ten leading foundation model providers.","All inputs hold. No November 10 earnings are anticipated or inserted. Specialized infrastructure remains valuable, with supplier, funding and customer concentration limiting independent control.","Independent GPU cloud platforms retain pricing and customer control as infrastructure matures.",[{"title":"CoreWeave reporting calendar and platform disclosure","url":"https://investors.coreweave.com/news/news-details/2026/CoreWeave-Announces-Date-of-Third-Quarter-2026-Financial-Results-and-Conference-Call/default.aspx","date_label":"2026-10-27","accessed_on":"2026-11-09"}]],["arm","Arm",[[28,64.4,[85,60,25,5],"current_assessment","2026-11-09"],[26,68.8,[90,65,30,5],"forecast","2027-09-18"],[26,70.6,[90,70,35,10],"forecast","2030-09-18"]],"Arm reports doubled datacenter royalties and growing Neoverse adoption. Its own AGI CPU commercial deliveries are still scheduled for fiscal Q4 2027.","Current Compute rises to 85 for deployed architecture reach. Forecast Compute rises to 90 in 2027 and 2030 for the move toward a more complete compute platform; direct silicon shipments remain prospective.","Customers capture AI growth through architectures or software layers that reduce Arm’s influence.",[{"title":"Arm FY2027 Q2 results","url":"https://newsroom.arm.com/news/arm-q2-fye27-results","date_label":"2026-11-04","accessed_on":"2026-11-09"}]],["palo-alto-networks","Palo Alto Networks",[[29,63.8,[10,50,90,0],"current_assessment","2026-11-09"],[31,65.6,[15,60,90,0],"forecast","2027-09-18"],[27,69.4,[15,65,95,0],"forecast","2030-09-18"]],"Strata Cloud Manager adds scoped roles for AI Gateway, Agent Identity Security, Runtime Security and related applications, including third-party identity-provider mappings.","Current Alignment rises to 90 for granular, documented access authority across AI security services. Other inputs hold; customer adoption and enforcement coverage remain the limiting questions.","Cloud platforms bundle sufficient agent security and capture the enforcement point.",[{"title":"Palo Alto Networks October access-control release","url":"https://docs.paloaltonetworks.com/strata-cloud-manager/new-features/by-date/strata-cloud-manager/october-2026","date_label":"October 2026 product release","accessed_on":"2026-11-09"}]],["ge-vernova","GE Vernova",[[30,63.1,[5,15,10,95],"current_assessment","2026-11-09"],[36,63.8,[5,20,10,95],"forecast","2027-09-18"],[40,64.4,[5,20,15,95],"forecast","2030-09-18"]],"GE Vernova reports gas-equipment backlog and slot reservations of 122 GW and growing power and grid equipment demand. The Trench acquisition is expected to close in late 2027.","Current Energy rises to 95 for scarce delivery slots and installed service capability. Orders are not operating generation. Trench remains excluded from current ownership and the forecast does not require its completion.","Project delays prevent equipment demand from becoming energized capacity.",[{"title":"GE Vernova Q3 2026 results and transaction status","url":"https://www.gevernova.com/news/articles/ge-vernova-releases-third-quarter-2026-financial-results-announces-agreement-acquire","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["sk-hynix","SK hynix",[[31,62.5,[95,15,5,5],"current_assessment","2026-11-09"],[38,63.1,[95,20,5,5],"forecast","2027-09-18"],[42,63.8,[95,20,10,5],"forecast","2030-09-18"]],"SK hynix reports HBM4 shipments ramping and long-term agreements covering more than half of 2027–2028 production capacity. Its expectation of shortage through 2030 is a forecast.","All inputs hold. The 95 Compute score already recognizes a difficult-to-substitute memory position. Contracted production and forecast scarcity do not justify maximum control over a market with credible suppliers.","Competing supply or architectural changes reduce memory scarcity and differentiation.",[{"title":"SK hynix Q3 2026 results","url":"https://news.skhynix.com/en/q3-2026-business-results/","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["vertiv","Vertiv",[[32,62.5,[10,25,15,90],"current_assessment","2026-11-09"],[28,67.5,[15,30,20,95],"forecast","2027-09-18"],[30,68.8,[15,35,25,95],"forecast","2030-09-18"]],"Vertiv reports sales growth of 61%, organic order growth above 100% and continuing capacity investment in critical digital infrastructure.","Current Energy rises to 90 and the 2027 forecast to 95 as power and cooling integration becomes harder to substitute. The 2030 forecast holds; this is enabling infrastructure control, not ownership of generation.","Standardized cooling and power designs make the supplier readily replaceable.",[{"title":"Vertiv Q3 2026 results","url":"https://investors.vertiv.com/news/news-details/2026/Vertiv-Reports-Strong-Third-Quarter-2026-with-Net-Sales-Growth-of-61-Organic-Orders-Growth-over-100-and-Diluted-EPS-Growth-of-91-Adjusted-Diluted-EPS-Growth-of-78-Raises-Full-Year-2026-Guidance-Across-All-Key-Metrics/","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["salesforce","Salesforce",[[33,62.5,[20,80,80,0],"current_assessment","2026-11-09"],[32,65.6,[20,80,85,0],"forecast","2027-09-18"],[31,68.8,[20,80,90,0],"forecast","2030-09-18"]],"Salesforce describes AIforce across Claude, Slack and its own applications, governed by existing permissions. Claudeforce is beta; Agentforce Coworker was generally available at announcement.","All inputs hold. External interfaces can preserve Salesforce permission authority while sharing the user relationship. Preview functionality receives no blanket current-control uplift.","External agents reduce Salesforce to replaceable data storage and capture the workflow logic.",[{"title":"Salesforce Dreamforce 2026 release and availability summary","url":"https://www.salesforce.com/blog/dreamforce-2026-announcements/","date_label":"2026-09-28","accessed_on":"2026-11-09"}]],["constellation-energy","Constellation Energy",[[34,61.3,[0,10,5,95],"current_assessment","2026-11-09"],[33,64.4,[0,10,5,100],"forecast","2027-09-18"],[38,65,[0,15,5,100],"forecast","2030-09-18"]],"Constellation reports a 97.2% nuclear capacity factor, includes Calpine acquired in January, and details new nuclear contracts. Google uprates begin no earlier than 2028; RISEC is a pending acquisition.","All inputs hold. Current Energy at 95 already recognizes firm-generation scarcity. Calpine is within the group, but future uprates, conditional financing and pending RISEC are not current output.","Grid access, outages, or contract structures prevent firm generation from translating into bargaining power.",[{"title":"Constellation Q3 2026 results","url":"https://investors.constellationenergy.com/news-releases/news-release-details/constellation-reports-third-quarter-2026-results","date_label":"2026-11-09","accessed_on":"2026-11-09"}]],["eaton","Eaton",[[35,61.3,[5,20,15,90],"current_assessment","2026-11-09"],[39,62.5,[5,25,20,90],"forecast","2027-09-18"],[43,63.8,[5,30,25,90],"forecast","2030-09-18"]],"Eaton reports record electrical orders, electrical backlog growth of 46% and an agreement to acquire COL Group.","Current Energy rises to 90 for electrical delivery and continuity infrastructure. Future scores hold. COL Group is pending and is not added to current ownership.","Capacity expansion eliminates equipment scarcity and customers regain bargaining power.",[{"title":"Eaton Q3 2026 results","url":"https://www.eaton.com/us/en-us/company/news-insights/news-releases/2026/eaton-reports-record-third-quarter-2026-results.html","date_label":"Q3 2026 release; accessed 2026-11-09","accessed_on":"2026-11-09"}]],["cloudflare","Cloudflare",[[36,61.3,[45,60,75,10],"current_assessment","2026-11-09"],[23,69.4,[50,70,85,10],"forecast","2027-09-18"],[17,75,[60,75,90,15],"forecast","2030-09-18"]],"Cloudflare reports revenue growth of 39% and current remaining performance obligation growth of 37%, while emphasizing its developer and security platform.","All inputs hold. Platform adoption reinforces the edge-control thesis; company-wide revenue does not isolate agent enforcement sufficiently to justify another step.","Cloud and identity incumbents capture agent enforcement before Cloudflare establishes durable control.",[{"title":"Cloudflare Q3 2026 results","url":"https://www.sec.gov/Archives/edgar/data/1477333/000147733326000060/q326exhibit991.htm","date_label":"2026-11-05","accessed_on":"2026-11-09"}]],["crowdstrike","CrowdStrike",[[37,60,[5,50,85,0],"current_assessment","2026-11-09"],[42,61.9,[10,60,85,0],"forecast","2027-09-18"],[36,65.6,[10,65,90,0],"forecast","2030-09-18"]],"CrowdStrike reports Falcon Guardian deployment at hundreds of organizations since September. Its separate NVIDIA hardware-enforcement collaboration is an expansion announcement.","Current Alignment rises to 85 for deployed agent-runtime protection. Forecasts hold. We do not treat an announced silicon integration as universally deployed.","Agent identities consolidate with other identity or cloud providers.",[{"title":"CrowdStrike Falcon Guardian deployment report","url":"https://www.crowdstrike.com/en-us/blog/why-organizations-secure-ai-agents-with-falcon-guardian/","date_label":"2026-10-23","accessed_on":"2026-11-09"}]],["synopsys","Synopsys",[[38,60,[80,55,25,0],"current_assessment","2026-11-09"],[34,64.4,[85,60,30,0],"forecast","2027-09-18"],[37,65.6,[85,65,35,0],"forecast","2030-09-18"]],"Synopsys reports strength in Design Automation and Ansys, with the latter already part of the group. No later quarterly result is assumed at this cutoff.","All inputs hold. Existing design and simulation breadth remains consistent with the baseline; verification tooling is not general authority over AI agent actions.","Design automation becomes more substitutable or is internalized by major chip companies.",[{"title":"Synopsys latest available quarterly results","url":"https://news.synopsys.com/2026-08-26-Synopsys-Posts-Financial-Results-for-Third-Quarter-Fiscal-Year-2026","date_label":"2026-08-26; re-reviewed 2026-11-09","accessed_on":"2026-11-09"}]],["snowflake","Snowflake",[[39,59.4,[35,60,75,5],"current_assessment","2026-11-09"],[37,63.8,[40,65,80,5],"forecast","2027-09-18"],[32,68.8,[45,70,85,10],"forecast","2030-09-18"]],"Snowflake announced Business Ontology and Cortex AI Gateway capabilities for context, model access, tools and agent actions. The related Horizon Context release is a public preview.","All inputs hold. The roadmap supports our existing governance forecast; announcements and previews are not evidence of broad deployed enforcement.","Agent builders access governed data without adopting Snowflake’s execution or control layer.",[{"title":"Snowflake Expedition 2026 agent governance announcement","url":"https://www.snowflake.com/en/news/press-releases/expedition-2026-business-ontology-ai-gateway/","date_label":"2026-11-03","accessed_on":"2026-11-09"}]],["nextera-energy","NextEra Energy",[[40,58.1,[0,10,5,90],"current_assessment","2026-11-09"],[47,58.8,[0,15,5,90],"forecast","2027-09-18"],[45,61.9,[0,15,5,95],"forecast","2030-09-18"]],"NextEra reports 3.7 GW of new renewables and storage origination and a 36.7-GW backlog. Its Dominion combination remains pending despite shareholder approval.","All inputs hold. Development scale supports the thesis, but backlog is not operating power and Dominion assets remain outside current ownership.","Interconnection and execution delays prevent development scale from becoming dependable power.",[{"title":"NextEra Q3 2026 results","url":"https://www.investor.nexteraenergy.com/~/media/Files/N/NEE-IR/reports-and-fillings/quarterly-earnings/2026/Q3%202026/2026-1021%20NEEQ32026News%20Release%20vFinal.pdf","date_label":"2026-10-21","accessed_on":"2026-11-09"}]],["vistra","Vistra",[[41,58.1,[0,10,5,90],"current_assessment","2026-11-09"],[41,61.9,[0,15,5,95],"forecast","2027-09-18"],[46,61.9,[0,15,5,95],"forecast","2030-09-18"]],"Vistra reports completion of the Cogentrix acquisition in October, adding approximately 5,500 MW of natural-gas generation.","Current Energy rises to 90 for completed, controlled generation; the 2027 forecast rises to 95 as firm-power bargaining capacity strengthens. The 2030 forecast holds at 95. Nuclear uprates remain prospective.","Uprates slip or the value of firm output fails to translate into stronger commercial control.",[{"title":"Vistra Q3 2026 investor results","url":"https://investor.vistracorp.com/2026-11-06-Vistra-Reports-Third-Quarter-2026-Results","date_label":"2026-11-06","accessed_on":"2026-11-09"}]],["cisco","Cisco",[[42,58.1,[55,50,70,10],"current_assessment","2026-11-09"],[44,61.9,[55,55,75,10],"forecast","2027-09-18"],[39,65,[55,55,80,10],"forecast","2030-09-18"]],"Cisco reports two AI Defense integrations already on the ServiceNow Store and participation in the Control Tower Alliance.","All inputs hold. Integrations improve the route to enterprise enforcement, but partnership membership is not proof that Cisco controls the entire permission layer.","Network visibility does not translate into authority over application-level agent actions.",[{"title":"Cisco AI Defense and ServiceNow integrations","url":"https://blogs.cisco.com/ai/cisco-ai-defense-joins-servicenows-control-tower-alliance","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["cadence","Cadence",[[43,57.5,[75,60,25,0],"current_assessment","2026-11-09"],[43,61.9,[80,65,30,0],"forecast","2027-09-18"],[34,66.9,[85,70,40,0],"forecast","2030-09-18"]],"Cadence reports more than 100 active AI Super Agent customer engagements, new domain models and growth in core EDA, hardware and system design.","Current Interface rises to 60 as engineering workflows deepen. Future scores hold. Specialized design control is distinct from universal AI Alignment authority.","Agent capabilities commoditize design interfaces faster than simulation platforms gain influence.",[{"title":"Cadence Q3 2026 results","url":"https://www.cadence.com/en_US/home/company/newsroom/press-releases/pr-ir/2026/cadence-reports-third-quarter-2026-financial-results.html","date_label":"2026-10-26","accessed_on":"2026-11-09"}]],["equinix","Equinix",[[44,57.5,[55,45,35,65],"current_assessment","2026-11-09"],[40,62.5,[60,50,40,70],"forecast","2027-09-18"],[33,68.1,[65,55,50,75],"forecast","2030-09-18"]],"Equinix reports Q3 revenue of $2.571 billion and raises annual guidance while continuing investment in its connected datacenter footprint.","All inputs hold. Connected, powered locations remain useful to inference, but company-wide results do not establish a new step in independent compute or electricity control.","Inference stays concentrated inside hyperscalers rather than moving to distributed enterprise locations.",[{"title":"Equinix Q3 2026 results","url":"https://investor.equinix.com/news-events/press-releases/detail/1128/equinix-reports-third-quarter-results-and-raises-2026","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["siemens-energy","Siemens Energy",[[45,56.9,[5,15,10,85],"current_assessment","2026-11-09"],[45,60.6,[5,20,10,90],"forecast","2027-09-18"],[41,64.4,[5,20,15,95],"forecast","2030-09-18"]],"Siemens Energy lists its August FY2026 Q3 release and a November 11 annual press conference, after this cutoff. Its operating portfolio includes gas turbines and grid equipment.","All inputs hold. Do not substitute Siemens AG automation announcements for Siemens Energy or anticipate November 11 results. Existing generation-equipment scarcity remains central.","Delivery constraints or competing technologies weaken its role in new powered capacity.",[{"title":"Siemens Energy reporting calendar and portfolio","url":"https://www.siemens-energy.com/us/en/home/press.html","date_label":"Current press calendar; accessed 2026-11-09","accessed_on":"2026-11-09"}]],["applied-materials","Applied Materials",[[46,56.3,[85,15,10,0],"current_assessment","2026-11-09"],[49,56.9,[85,20,10,0],"forecast","2027-09-18"],[50,56.9,[85,20,10,0],"forecast","2030-09-18"]],"Applied Materials outlines longer-term growth expectations and its materials-engineering role in AI semiconductor manufacturing at SEMICON West.","All inputs hold. The evidence supports a major Compute position; growth expectations and research investment do not yet establish a higher control anchor.","New process architectures increase its strategic dependence beyond our forecast.",[{"title":"Applied Materials SEMICON West investor presentation release","url":"https://ir.appliedmaterials.com/node/29776/pdf","date_label":"2026-10-13","accessed_on":"2026-11-09"}]],["deepseek","DeepSeek",[[47,56.3,[65,65,45,15],"current_assessment","2026-11-09"],[35,64.4,[75,70,50,20],"forecast","2027-09-18"],[20,73.8,[85,80,60,25],"forecast","2030-09-18"]],"DeepSeek opened its in-house Search and Fetch API and updated V4.1 Flash across its API, web and app products. Search scale and benchmark results are company-reported.","Current Interface rises five points to 65 for direct retrieval and developer integration beyond model weights. Forecasts hold; an open API does not establish authority over downstream action permissions.","Adoption fails to create durable infrastructure access or direct user relationships.",[{"title":"DeepSeek October release notes","url":"https://api-docs.deepseek.com/updates/","date_label":"2026-10-17 release entry","accessed_on":"2026-11-09"}]],["micron","Micron",[[48,55.6,[85,10,5,5],"current_assessment","2026-11-09"],[46,59.4,[90,15,5,5],"forecast","2027-09-18"],[47,60.6,[90,20,10,5],"forecast","2030-09-18"]],"Micron reports HBM4 volume production and HBM4 16-high samples; HBM4E volume ramp remains expected in calendar 2027.","All inputs hold. HBM4 execution supports the existing 85 Compute score; HBM4E remains prospective and lower chip power consumption is not control of electricity.","HBM execution or customer qualification fails to sustain the expected gains.",[{"title":"Micron FY2026 Form 10-K","url":"https://www.sec.gov/Archives/edgar/data/723125/000072312526000023/mu-20260903.htm","date_label":"FY2026 Form 10-K; year ended 2026-09-03","accessed_on":"2026-11-09"}]],["kla","KLA",[[49,54.4,[80,15,20,0],"current_assessment","2026-11-09"],[48,57.5,[85,15,20,0],"forecast","2027-09-18"],[49,58.8,[85,20,25,0],"forecast","2030-09-18"]],"KLA reports September-quarter revenue of $4.14 billion and results above the midpoint of guidance.","All inputs hold. Process-control importance persists; manufacturing inspection is not general authority over AI systems or their actions.","Manufacturing changes reduce dependence on its inspection and process-control tools.",[{"title":"KLA FY2027 Q1 results","url":"https://ir.kla.com/sec-filings/all-sec-filings/content/0000319201-26-000032/exhibit991earningsrelease0.htm","date_label":"2026-10-28","accessed_on":"2026-11-09"}]],["lam-research","Lam Research",[[50,51.9,[80,10,5,0],"current_assessment","2026-11-09"],[50,55.6,[85,15,5,0],"forecast","2027-09-18"],[48,59.4,[90,15,10,0],"forecast","2030-09-18"]],"Lam reports September-quarter revenue of $8.22 billion, up 22% sequentially, and stronger operating margins.","All inputs hold. Execution reinforces process-equipment dependence, but a quarterly sales increase alone does not demonstrate a structural step in control.","Process shifts favor rival equipment or reduce the value of its manufacturing steps.",[{"title":"Lam Research September 2026 quarter results","url":"https://newsroom.lamresearch.com/2026-10-21-Lam-Research-Corporation-Reports-Financial-Results-for-the-Quarter-Ended-September-27%2C-2026","date_label":"2026-10-21","accessed_on":"2026-11-09"}]]]}</script>
