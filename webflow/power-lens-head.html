<script type="application/json" id="power-lens-data">{"edition_id":"2026-09-18","as_of":"2026-09-18","methodology_id":"ai-power-rankings-1.0.0","change_note":"Inaugural ranked edition. New longitudinal baseline; prior v1 exposure and v2 pilot profiles are separate series.","rows":[["alphabet","Alphabet",[[1,94.4,[95,100,90,70],"current_assessment","2026-09-18"],[1,96.9,[100,100,95,80],"forecast","2027-09-18"],[1,98.1,[100,100,95,90],"forecast","2030-09-18"]],"Google describes TPUs as the infrastructure behind Gemini and its billion-user products. Ironwood is generally available; eighth-generation TPUs are still listed as coming soon.","Own silicon, consumer distribution, cloud operations, and enterprise controls give Alphabet the broadest position. We expect that combination to preserve first place through 2030; new chips enter the forecast, not today’s deployed inventory.","Agents displace Google’s discovery surfaces faster than Gemini captures the new interaction.",[{"title":"TPU product and deployment status","url":"https://cloud.google.com/tpu","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["microsoft","Microsoft",[[2,91.9,[90,95,95,75],"current_assessment","2026-09-18"],[2,96.3,[95,100,95,80],"forecast","2027-09-18"],[2,98.1,[95,100,100,90],"forecast","2030-09-18"]],"Microsoft’s July earnings release reports more than 30 million paid Microsoft 365 Copilot seats and Azure annual revenue above $100 billion.","Enterprise distribution and authority over work reinforce Azure. We expect Microsoft to become a leading institutional permission layer for agents, retaining second place even as independent model companies grow.","Customers move their agent orchestration and identities outside Microsoft’s products.",[{"title":"FY2026 Q4 results","url":"https://www.microsoft.com/en-us/Investor/earnings/FY-2026-Q4/press-release-webcast","date_label":"2026-07-29","accessed_on":"2026-09-18"}]],["amazon","Amazon",[[3,91.9,[95,90,90,80],"current_assessment","2026-09-18"],[3,96.3,[100,90,95,85],"forecast","2027-09-18"],[4,97.5,[100,95,95,90],"forecast","2030-09-18"]],"Amazon’s Q2 release describes AWS growth, Trainium commitments, Bedrock, and AgentCore capabilities, including tools for agent execution.","AWS combines infrastructure, custom chips, model distribution, and operating permissions. Power procurement supports expansion. Amazon gains absolute power, but we expect OpenAI to capture enough direct interaction to move ahead by 2030.","Custom-chip commitments fail to convert into useful capacity or customers bypass AWS’s agent layer.",[{"title":"Q2 2026 results","url":"https://ir.aboutamazon.com/news-release/news-release-details/2026/Amazon-com-Announces-Second-Quarter-Results/","date_label":"2026-07-30","accessed_on":"2026-09-18"}]],["meta","Meta",[[4,86.9,[90,95,65,65],"current_assessment","2026-09-18"],[5,88.8,[95,95,70,70],"forecast","2027-09-18"],[5,91.3,[95,95,80,80],"forecast","2030-09-18"]],"Meta reports 3.6 billion daily active people for June and substantial AI infrastructure spending. Its release distinguishes actual quarterly spending from full-year guidance.","Mass consumer distribution gives Meta immediate AI reach. Compute and contracted energy support growth; enterprise authorization remains a weaker force. We expect its score to rise while agent-native competitors climb faster.","Meta turns messaging into the dominant environment for commercial agent transactions.",[{"title":"Q2 2026 results","url":"https://investor.atmeta.com/investor-news/press-release-details/2026/Meta-Reports-Second-Quarter-2026-Results/default.aspx","date_label":"2026-07-29","accessed_on":"2026-09-18"}]],["nvidia","NVIDIA",[[5,85.6,[100,90,65,30],"current_assessment","2026-09-18"],[6,86.9,[100,90,70,35],"forecast","2027-09-18"],[11,85.6,[95,90,75,45],"forecast","2030-09-18"]],"NVIDIA’s August results report $89 billion in quarterly data-center revenue and describe Vera Rubin production, software, and infrastructure partnerships.","The leading compute supplier also controls a powerful developer interface. We expect custom silicon and competing software to reduce its relative dominance by 2030, while model platforms gain permissions and direct users. Infrastructure partnerships are not ownership of partners’ electricity.","CUDA and NVIDIA systems become even harder to substitute as custom-chip deployments disappoint.",[{"title":"Q2 FY2027 results","url":"https://nvidianews.nvidia.com/news/nvidia-announces-financial-results-for-second-quarter-fiscal-2027","date_label":"2026-08-26","accessed_on":"2026-09-18"}]],["openai","OpenAI",[[6,85.6,[85,95,80,45],"current_assessment","2026-09-18"],[4,93.1,[95,100,85,65],"forecast","2027-09-18"],[3,97.5,[100,100,95,85],"forecast","2030-09-18"]],"OpenAI’s September infrastructure account describes serving products used by more than one billion people weekly across 40 regions.","Direct user intent is its strategic asset. We forecast rising control of compute, powered capacity, and agent permissions, taking OpenAI to fourth in 2027 and third in 2030. This assumes execution, not automatic ownership of partners’ infrastructure.","Agent usage does not translate into durable workflow control, or infrastructure obligations outpace delivery.",[{"title":"Scaling storage for one billion users","url":"https://openai.com/index/scaling-storage-one-billion-users-part-one/","date_label":"2026-09-11","accessed_on":"2026-09-18"}]],["apple","Apple",[[7,83.8,[65,100,85,20],"current_assessment","2026-09-18"],[8,85,[70,100,85,25],"forecast","2027-09-18"],[12,83.8,[75,95,90,30],"forecast","2030-09-18"]],"Apple’s July results describe the new Siri announced at WWDC26 and another record for its active installed device base.","Devices and operating-system permissions make Apple a gatekeeper even when another company supplies the model. We expect some interaction to move into cross-platform agents, reducing relative interface dominance by 2030.","Siri becomes the default agent for most device actions, preserving Apple’s maximum interface position.",[{"title":"Q3 FY2026 results","url":"https://www.apple.com/newsroom/2026/07/apple-reports-third-quarter-results/","date_label":"2026-07-30","accessed_on":"2026-09-18"}]],["bytedance","ByteDance",[[8,80.6,[80,95,55,35],"current_assessment","2026-09-18"],[12,82.5,[85,95,60,40],"forecast","2027-09-18"],[15,81.3,[85,90,65,50],"forecast","2030-09-18"]],"ByteDance’s Seed1.8 paper describes work on agents that use tools and graphical interfaces.","Content distribution and recommendation remain powerful interfaces. We forecast growth in compute and agents, but reduced relative interface dominance as intent-driven interaction spreads. This is a group-level judgment, not an assumption of unrestricted ownership of every regional TikTok operation.","Agent products capture enterprise permissions at the same scale as its consumer products capture attention.",[{"title":"Seed1.8 research paper","url":"https://arxiv.org/abs/2603.20633","date_label":"2026-03-21","accessed_on":"2026-09-18"}]],["oracle","Oracle",[[9,80.6,[85,70,85,65],"current_assessment","2026-09-18"],[7,85.6,[90,75,85,75],"forecast","2027-09-18"],[9,87.5,[90,80,90,80],"forecast","2030-09-18"]],"Oracle’s current OCI offering spans public, dedicated, hybrid, and multicloud deployments alongside its database environment.","Database permissions and infrastructure demand reinforce each other. We expect Oracle to gain compute and powered capacity while keeping meaningful institutional control; concentration in a few major AI customers limits our forecast.","Large AI customers internalize capacity or fail to meet commitments.",[{"title":"Oracle Cloud Infrastructure","url":"https://www.oracle.com/cloud/","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["tencent","Tencent",[[10,78.8,[70,90,75,35],"current_assessment","2026-09-18"],[14,80.6,[75,90,80,40],"forecast","2027-09-18"],[13,83.1,[80,90,85,50],"forecast","2030-09-18"]],"Tencent’s corporate materials describe Weixin/WeChat distribution and its cloud and enterprise services.","We expect messaging, transactions, and enterprise integration to keep Tencent powerful in China. It strengthens across the forces but faces faster growth elsewhere in the cohort.","Commercial agents bypass Tencent’s interaction and transaction environment.",[{"title":"Tencent corporate overview","url":"https://www.tencent.com/","date_label":"Current company material","accessed_on":"2026-09-18"}]],["alibaba","Alibaba",[[11,78.8,[80,85,75,50],"current_assessment","2026-09-18"],[10,83.8,[85,90,80,55],"forecast","2027-09-18"],[10,86.3,[90,90,85,65],"forecast","2030-09-18"]],"Alibaba’s investor materials organize its AI activity around models, cloud infrastructure, responsible AI, and governance alongside commerce.","Cloud, Qwen distribution, and commerce give Alibaba several routes to agent adoption. We forecast stronger enterprise control and infrastructure, with less global interface dominance than the leading US platforms.","Model use grows without Alibaba retaining the cloud workload or customer interaction.",[{"title":"Alibaba investor materials","url":"https://www.alibabagroup.com/en-US/ir-financial-reports-financial-results","date_label":"Current investor materials","accessed_on":"2026-09-18"}]],["huawei","Huawei",[[12,78.1,[85,80,75,45],"current_assessment","2026-09-18"],[11,83.8,[90,85,80,55],"forecast","2027-09-18"],[7,90,[95,90,85,70],"forecast","2030-09-18"]],"Huawei’s current Connect program centers on Kunpeng, Ascend, cloud, and the infrastructure for agentic AI.","We expect Huawei to consolidate a major alternative AI stack across Chinese compute, devices, enterprise systems, and digital power. Its rise assumes manufacturing and software progress; announced chip roadmaps are not deployed 2026 capacity.","Manufacturing limits or weak developer adoption prevent Ascend from becoming a durable alternative.",[{"title":"Huawei Connect","url":"https://www.huawei.com/en/events/huaweiconnect","date_label":"Current 2026 conference material","accessed_on":"2026-09-18"}]],["spacex","SpaceX (including xAI)",[[13,74.4,[85,80,50,40],"current_assessment","2026-09-18"],[13,80.6,[90,85,55,55],"forecast","2027-09-18"],[8,87.5,[95,90,65,70],"forecast","2030-09-18"]],"xAI announced that it joined SpaceX in February 2026.","We score SpaceX, xAI, Grok, and X once at the group level. Our forecast combines terrestrial AI infrastructure and interfaces with expanded operating reach. It gives no 2026 credit for hypothetical orbital data centers and does not include Tesla’s assets.","Infrastructure expansion fails to produce durable AI usage and governing authority.",[{"title":"xAI joins SpaceX","url":"https://x.ai/news/xai-joins-spacex","date_label":"2026-02-02","accessed_on":"2026-09-18"}]],["anthropic","Anthropic",[[14,74.4,[80,80,80,35],"current_assessment","2026-09-18"],[9,83.8,[85,90,85,50],"forecast","2027-09-18"],[6,90,[90,95,90,65],"forecast","2030-09-18"]],"Anthropic’s August update describes containment and monitoring changes following evaluation incidents, including interventions that block actions and alert humans.","We forecast Claude becoming a major interface for delegated work, with greater compute access and enforceable controls. Its Alignment score reflects the ability to govern deployment, not a claim that its models cannot misbehave.","Incidents or dependence on outside infrastructure prevent Claude from becoming an institutional operating layer.",[{"title":"Alignment and security practices update","url":"https://www.anthropic.com/news/improving-alignment-security-efforts","date_label":"2026-08-31","accessed_on":"2026-09-18"}]],["samsung-electronics","Samsung Electronics",[[15,73.1,[85,80,60,20],"current_assessment","2026-09-18"],[15,77.5,[90,80,65,25],"forecast","2027-09-18"],[16,78.8,[90,80,70,30],"forecast","2030-09-18"]],"Samsung’s Q2 results describe HBM4 production expansion, HBM4E samples, advanced foundry activity, and its Galaxy ecosystem.","Memory, foundry, and devices produce unusual breadth. We expect better compute execution and stronger device controls, but continued dependence on external AI platforms. Other Samsung group companies are excluded.","Memory and foundry improvements fail to turn into durable competitive positions.",[{"title":"Q2 2026 results","url":"https://news.samsung.com/global/samsung-electronics-announces-second-quarter-2026-results","date_label":"2026-07-30","accessed_on":"2026-09-18"}]],["tsmc","TSMC",[[16,68.1,[100,15,10,20],"current_assessment","2026-09-18"],[24,68.8,[100,15,10,25],"forecast","2027-09-18"],[28,68.8,[100,15,10,25],"forecast","2030-09-18"]],"TSMC’s Q2 investor release reports operating results separately from Q3 guidance.","We assign maximum Compute power to the manufacturing bottleneck, with limited interface and AI-permission control. Its score stays strong; its rank falls as broader platforms expand. The index deliberately distinguishes manufacturing indispensability from control of the entire AI stack.","Leading-edge production diversifies enough to weaken TSMC’s bottleneck.",[{"title":"Q2 2026 results","url":"https://investor.tsmc.com/english/quarterly-results/2026/q2","date_label":"2026 Q2 reporting","accessed_on":"2026-09-18"}]],["tesla","Tesla",[[17,68.1,[65,75,50,55],"current_assessment","2026-09-18"],[16,73.1,[70,80,55,60],"forecast","2027-09-18"],[14,83.1,[80,90,65,70],"forecast","2030-09-18"]],"Tesla describes custom inference chips, fleet-based neural networks, evaluation infrastructure, and an Optimus development program.","We forecast stronger physical Interface power through vehicles and robotics, supported by compute and energy storage. Optimus remains an execution-dependent forecast rather than assumed mass deployment. Tesla is separate from SpaceX.","Autonomy and robotics fail to scale operationally, or deployments require substantially more human supervision.",[{"title":"Tesla AI and Robotics","url":"https://www.tesla.com/AI","date_label":"Current company material","accessed_on":"2026-09-18"}]],["palantir","Palantir",[[18,67.5,[20,70,90,0],"current_assessment","2026-09-18"],[17,71.9,[25,75,95,0],"forecast","2027-09-18"],[18,73.8,[25,85,95,5],"forecast","2030-09-18"]],"AIP documentation describes operational agents, access controls, auditing, governance, and deployment across enterprise and edge environments.","We expect authority over operational actions to become more valuable as models become interchangeable. Palantir gains Interface and Alignment power without needing to own frontier training infrastructure.","Customers standardize agent permissions and workflows on competing enterprise platforms.",[{"title":"Palantir AIP overview","url":"https://www.palantir.com/docs/foundry/aip/overview","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["ibm","IBM",[[19,67.5,[55,60,80,25],"current_assessment","2026-09-18"],[27,67.5,[55,60,80,25],"forecast","2027-09-18"],[44,63.1,[50,55,75,25],"forecast","2030-09-18"]],"IBM’s July results discuss its hybrid software businesses and AI-related portfolio.","Hybrid infrastructure and institutional governance support its current position. We forecast relative erosion as cloud-native and agent-native platforms capture more work, while IBM remains relevant in demanding deployments.","Its hybrid governance becomes the default across heterogeneous AI environments.",[{"title":"Q2 2026 results","url":"https://newsroom.ibm.com/2026-07-22-IBM-RELEASES-SECOND-QUARTER-RESULTS","date_label":"2026-07-22","accessed_on":"2026-09-18"}]],["asml","ASML",[[20,66.3,[100,20,10,0],"current_assessment","2026-09-18"],[28,66.3,[100,20,10,0],"forecast","2027-09-18"],[35,66.3,[100,20,10,0],"forecast","2030-09-18"]],"ASML’s Q2 reporting provides its current operating and order outlook for semiconductor manufacturing equipment.","We assign maximum Compute power to its lithography position and expect that bottleneck to persist. Limited control of AI interfaces, permissions, and electricity keeps the composite below broad platform owners.","Customers achieve comparable leading-edge production with materially less dependence on ASML.",[{"title":"Q2 2026 results","url":"https://www.asml.com/en/news/press-releases/2026/q2-2026-financial-results","date_label":"2026 Q2 reporting","accessed_on":"2026-09-18"}]],["sap","SAP",[[21,66.3,[20,80,85,5],"current_assessment","2026-09-18"],[21,69.4,[20,80,90,5],"forecast","2027-09-18"],[21,73.1,[25,80,95,5],"forecast","2030-09-18"]],"SAP’s Joule offering connects agents to business processes, enterprise context, security, and governance.","Control over business transactions can outlast changes in the conversational front end. We expect SAP’s Alignment power to grow as agents execute consequential enterprise actions.","Customers move authoritative business actions and permissions outside SAP.",[{"title":"SAP Business AI","url":"https://www.sap.com/products/artificial-intelligence.html","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["schneider-electric","Schneider Electric",[[22,65.6,[10,40,25,90],"current_assessment","2026-09-18"],[19,70.6,[15,45,30,95],"forecast","2027-09-18"],[23,71.9,[15,50,35,95],"forecast","2030-09-18"]],"Schneider’s data-center offering combines power infrastructure, management software, and operational planning.","We expect electrical infrastructure and its operating software to become more valuable as powered capacity constrains AI. Energy leads; management interfaces add breadth. Schneider is not scored as owning its customers’ generation.","Equipment supply catches up quickly or large operators internalize the management layer.",[{"title":"Data-center solutions","url":"https://www.se.com/ww/en/work/solutions/data-centers-and-networks/","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["broadcom","Broadcom",[[23,65.6,[90,35,35,5],"current_assessment","2026-09-18"],[20,69.4,[95,40,35,5],"forecast","2027-09-18"],[25,71.3,[95,45,45,5],"forecast","2030-09-18"]],"Broadcom’s September results attribute substantial AI semiconductor growth to custom accelerators and networking.","Custom AI silicon and connectivity gain importance as hyperscalers diversify compute. We expect growing Compute power and some enterprise-software control, while its customers retain most end-user authority.","Hyperscalers internalize chip design and networking value faster than Broadcom expands.",[{"title":"Q3 FY2026 results","url":"https://investors.broadcom.com/news-releases/news-release-details/broadcom-inc-announces-third-quarter-fiscal-year-2026-financial","date_label":"2026-09-02","accessed_on":"2026-09-18"}]],["amd","AMD",[[24,65,[85,55,30,10],"current_assessment","2026-09-18"],[22,69.4,[90,60,35,10],"forecast","2027-09-18"],[24,71.9,[90,70,40,15],"forecast","2030-09-18"]],"AMD markets Instinct accelerators as its AI and high-performance computing platform.","We expect AMD to become a more credible second compute ecosystem. The forecast requires adoption of both hardware and software; price competition alone does not create interface power.","Accelerator adoption remains episodic and developers remain locked into competing stacks.",[{"title":"AMD Instinct","url":"https://www.amd.com/en/products/accelerators/instinct.html","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["coreweave","CoreWeave",[[25,65,[80,35,30,55],"current_assessment","2026-09-18"],[18,71.9,[85,45,35,70],"forecast","2027-09-18"],[27,69.4,[80,40,45,70],"forecast","2030-09-18"]],"CoreWeave’s current platform centers on specialized GPU cloud infrastructure, orchestration, and storage for AI workloads.","We forecast a strong 2027 buildout, then greater competitive pressure by 2030 as major customers integrate capacity. Energy access grows, but reliance on suppliers, financiers, and concentrated customers limits sovereignty.","Independent GPU cloud platforms retain pricing and customer control as infrastructure matures.",[{"title":"CoreWeave platform","url":"https://www.coreweave.com/","date_label":"Current company material","accessed_on":"2026-09-18"}]],["servicenow","ServiceNow",[[26,64.4,[15,75,85,0],"current_assessment","2026-09-18"],[25,68.8,[20,80,90,0],"forecast","2027-09-18"],[22,72.5,[20,85,95,0],"forecast","2030-09-18"]],"AI Control Tower is presented as a system for governing and managing AI across an organization.","Workflow position can become authority over which agents may act. We forecast strong Alignment gains and expanding Interface control, with limited physical infrastructure power.","The control layer remains a reporting dashboard while other platforms enforce permissions.",[{"title":"AI Control Tower","url":"https://www.servicenow.com/products/ai-control-tower.html","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["databricks","Databricks",[[27,63.8,[40,65,80,5],"current_assessment","2026-09-18"],[26,68.8,[45,75,85,5],"forecast","2027-09-18"],[19,73.8,[50,80,90,10],"forecast","2030-09-18"]],"Unity Catalog describes governance for data, models, and agents, with permissions, lineage, and AI gateway controls.","We expect enterprise data context and enforceable access to become a major Alignment position. Its forecast also assumes developers increasingly build agent workflows within its environment.","Open standards or cloud-native catalogs displace its authority over AI execution.",[{"title":"Unity Catalog","url":"https://www.databricks.com/product/unity-catalog","date_label":"Current product documentation","accessed_on":"2026-09-18"}]],["sk-hynix","SK hynix",[[28,62.5,[95,15,5,5],"current_assessment","2026-09-18"],[38,63.1,[95,20,5,5],"forecast","2027-09-18"],[42,63.8,[95,20,10,5],"forecast","2030-09-18"]],"SK hynix’s September AI infrastructure material covers HBM, enterprise storage, and newer memory approaches.","We expect advanced memory to remain a critical compute bottleneck, supporting a high Compute score. It gains little control over the applications or permissions that run on that memory.","Competing supply or architectural changes reduce memory scarcity and differentiation.",[{"title":"AI Infra Summit 2026","url":"https://news.skhynix.com/en/ai-infra-summit-2026/","date_label":"2026-09-17","accessed_on":"2026-09-18"}]],["salesforce","Salesforce",[[29,62.5,[20,80,80,0],"current_assessment","2026-09-18"],[30,65.6,[20,80,85,0],"forecast","2027-09-18"],[30,68.8,[20,80,90,0],"forecast","2030-09-18"]],"The September AIforce announcement describes exposing business data, workflows, logic, and permissions through multiple interfaces.","We expect Salesforce to retain authority over customer-related actions even when agents use another interface. Alignment rises, but interface growth is constrained by that same openness.","External agents reduce Salesforce to replaceable data storage and capture the workflow logic.",[{"title":"AIforce announcement","url":"https://www.salesforce.com/news/stories/aiforce-announcement/","date_label":"2026-09-15","accessed_on":"2026-09-18"}]],["constellation-energy","Constellation Energy",[[30,61.3,[0,10,5,95],"current_assessment","2026-09-18"],[32,64.4,[0,10,5,100],"forecast","2027-09-18"],[38,65,[0,15,5,100],"forecast","2030-09-18"]],"Constellation’s current materials emphasize nuclear electricity and discuss the Crane restart as an ongoing project.","We forecast maximum Energy power from scarce firm generation and the ability to contract it to large buyers. Future restarts receive forecast credit only. Limited Interface and Alignment power constrain the overall score.","Grid access, outages, or contract structures prevent firm generation from translating into bargaining power.",[{"title":"Constellation news","url":"https://www.constellationenergy.com/news.html","date_label":"Current 2026 company material","accessed_on":"2026-09-18"}]],["arm","Arm",[[31,61.3,[80,60,25,5],"current_assessment","2026-09-18"],[31,65.6,[85,65,30,5],"forecast","2027-09-18"],[33,67.5,[85,70,35,10],"forecast","2030-09-18"]],"Arm’s current newsroom highlights its AI CPU and Neoverse platform activity.","Instruction-set and software ecosystem reach become more valuable as AI spreads across cloud and devices. We expect gains in Compute and developer Interface, with much less control of application permissions.","Customers capture AI growth through architectures or software layers that reduce Arm’s influence.",[{"title":"Arm newsroom","url":"https://newsroom.arm.com/","date_label":"Current September 2026 material","accessed_on":"2026-09-18"}]],["cloudflare","Cloudflare",[[32,61.3,[45,60,75,10],"current_assessment","2026-09-18"],[23,69.4,[50,70,85,10],"forecast","2027-09-18"],[17,75,[60,75,90,15],"forecast","2030-09-18"]],"Cloudflare’s September announcement describes AI-assisted vulnerability management integrated with its edge defense.","We expect the edge to become an enforcement point for agents, identities, traffic, and runtime behavior. That expands Alignment and Interface power alongside distributed compute.","Cloud and identity incumbents capture agent enforcement before Cloudflare establishes durable control.",[{"title":"AI-powered edge defense announcement","url":"https://www.cloudflare.com/press/press-releases/2026/cloudflare-partners-with-openai-daybreak-models-to-redefine-vulnerability-management-with-ai-powered-edge-defense/","date_label":"2026-09-03","accessed_on":"2026-09-18"}]],["palo-alto-networks","Palo Alto Networks",[[33,60.6,[10,50,85,0],"current_assessment","2026-09-18"],[29,65.6,[15,60,90,0],"forecast","2027-09-18"],[26,69.4,[15,65,95,0],"forecast","2030-09-18"]],"Palo Alto Networks announced the completed acquisition of Portkey to strengthen AI agent security.","We expect model gateways and runtime controls to become powerful Alignment infrastructure. Its forecast assumes integration creates an actual enforcement layer, not merely a wider product catalog.","Cloud platforms bundle sufficien
