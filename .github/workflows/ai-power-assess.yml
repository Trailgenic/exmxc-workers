name: AI Power Pilot Assessment

on:
  push:
    branches:
      - main
    paths:
      - data/ai_power_v2/canary-trigger.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-power-v2-targeted-assessment
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CALIBRATION_ENTITIES: company-tsmc,company-nextera-energy,company-microsoft,company-anthropic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate repository and calibration contracts
        run: |
          npm run validate:ai-power
          npm test
          npm run test:workers
          npm run assess:ai-power -- --entities "$CALIBRATION_ENTITIES" --manifest-dir data/ai_power_v2/manifests --dry-run
      - name: Capture and validate one immutable calibration source snapshot
        run: |
          mkdir -p artifacts
          node scripts/snapshot-ai-power-sources.mjs --entities "$CALIBRATION_ENTITIES" --manifest-dir data/ai_power_v2/manifests --output-dir artifacts/ai-power-v2-source-snapshots > artifacts/ai-power-v2-source-preflight.json
      - name: Generate two non-publishing Luna attempts
        run: |
          node scripts/assess-ai-power-v2.mjs --entities "$CALIBRATION_ENTITIES" --manifest-dir data/ai_power_v2/manifests --documents-dir artifacts/ai-power-v2-source-snapshots > artifacts/ai-power-v2-calibration-attempt-a.json
          node scripts/assess-ai-power-v2.mjs --entities "$CALIBRATION_ENTITIES" --manifest-dir data/ai_power_v2/manifests --documents-dir artifacts/ai-power-v2-source-snapshots > artifacts/ai-power-v2-calibration-attempt-b.json
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_POWER_MODEL: gpt-5.6-luna
          AI_POWER_REASONING_EFFORT: medium
      - name: Build conservative repeat-run consensus
        run: node scripts/reconcile-ai-power-v2.mjs artifacts/ai-power-v2-calibration-attempt-a.json artifacts/ai-power-v2-calibration-attempt-b.json > artifacts/ai-power-v2-calibration-consensus.json
      - name: Print bounded calibration diagnostics
        run: |
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("artifacts/ai-power-v2-calibration-consensus.json","utf8")); console.log(JSON.stringify({status:r.status,writes_repository:r.writes_repository,repeat_policy:r.repeat_policy,usage:r.usage,profiles:r.diagnostics.length,graded_profiles:r.diagnostics.filter(x=>Object.values(x.consensus_grades).some(v=>v!==null)).length,diagnostics:r.diagnostics},null,2));'
      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-power-v2-calibration-candidate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
