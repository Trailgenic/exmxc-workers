name: AI Power Pilot Assessment

on:
  push:
    branches:
      - main
    paths:
      - data/ai_power_v2/canary-trigger.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate repository contracts
        run: |
          npm run validate:ai-power
          npm test
      - name: Validate canary manifests without network or model calls
        run: |
          npm run assess:ai-power -- --entity company-asml --manifest data/ai_power_v2/manifests/company-asml.json --dry-run
          npm run assess:ai-power -- --entity company-microsoft --manifest data/ai_power_v2/manifests/company-microsoft.json --dry-run
      - name: Generate non-publishing canary candidates
        id: generate_canary
        continue-on-error: true
        run: |
          mkdir -p artifacts
          set +e
          node scripts/assess-ai-power-v2.mjs --entity company-asml --manifest data/ai_power_v2/manifests/company-asml.json > artifacts/ai-power-v2-canary-asml.json
          asml_status=$?
          node scripts/assess-ai-power-v2.mjs --entity company-microsoft --manifest data/ai_power_v2/manifests/company-microsoft.json > artifacts/ai-power-v2-canary-microsoft.json
          microsoft_status=$?
          node -e 'const fs=require("fs"); for (const file of process.argv.slice(1)) { const r=JSON.parse(fs.readFileSync(file)); console.log(JSON.stringify({file,status:r.status,model:r.model,reasoning_effort:r.reasoning_effort,run_log:(r.run_log||[]).map(x=>({entity_id:x.entity_id,status:x.status,error:x.error,quality:x.quality,usage:{extraction:x.model_usage?.extraction?.usage||null,verification:x.model_usage?.verification?.usage||null}})),validation_errors:r.validation_errors},null,2)); }' artifacts/ai-power-v2-canary-asml.json artifacts/ai-power-v2-canary-microsoft.json
          test "$asml_status" -eq 0 -a "$microsoft_status" -eq 0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_POWER_MODEL: gpt-5.6-luna
          AI_POWER_REASONING_EFFORT: medium
      - name: Upload candidate for validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-power-v2-canary-candidate
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce canary validation result
        if: always() && steps.generate_canary.outcome == 'failure'
        run: exit 1
