name: AI Citation Tracker

on:
  schedule:
    - cron: "17 15 * * 1" # Mondays, about 7:17 AM Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-citation-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ask AI engines and record citations
        run: node scripts/track-ai-citations.mjs --site exmxc
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit dated results
        run: |
          git config user.name "citation-tracker"
          git config user.email "citation-tracker@users.noreply.github.com"
          git add data/citation_tracker
          git diff --cached --quiet || git commit -m "Citation tracker: exmxc $(date -u +%F)"
          git push
