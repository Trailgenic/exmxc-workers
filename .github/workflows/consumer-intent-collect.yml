name: Consumer Intent Daily Collection

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/consumer_intent_v1/collection-trigger.json

permissions:
  contents: write

concurrency:
  group: consumer-intent-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONSUMER_INTENT_MODEL: gpt-5.6-luna
      CONSUMER_INTENT_REASONING_EFFORT: medium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect and independently verify public consumer observations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p artifacts
          npm run collect:consumer-intent -- \
            --date "$(date -u +%F)" \
            --skip-existing \
            --merged-output artifacts/consumer-intent-observations.json \
            --summary-output artifacts/consumer-intent-collection-summary.json
      - name: Build and promote an immutable pilot release when new evidence exists
        id: release
        run: |
          NEW_COUNT="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("artifacts/consumer-intent-collection-summary.json","utf8")); process.stdout.write(String(x.new_accepted));')"
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            TODAY="$(date -u +%F)"
            LATEST_RELEASE="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("data/consumer_intent_v1/release-archive.json","utf8")); const latest=x.releases.find(r=>r.release_id===x.latest); process.stdout.write(`${latest?.as_of||""}|${latest?.release_status||""}`);')"
            if [ "$LATEST_RELEASE" = "$TODAY|pilot" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          TODAY="$(date -u +%F)"
          RELEASE_ID="consumer-intent-${TODAY}-pilot"
          npm run build:consumer-intent -- \
            --input artifacts/consumer-intent-observations.json \
            --as-of "$TODAY" \
            --release-id "$RELEASE_ID" \
            --model-version "${CONSUMER_INTENT_MODEL:-gpt-5.6-luna}" \
            --note "Automated daily pilot collection through ${TODAY}; all public readings remain subject to evidence gates." \
            --promote true
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Validate collection and release contracts
        run: |
          npm test
          npm run test:workers
          npm run validate:json
          npm run deploy:dry-run
      - name: Upload collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-intent-collection-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Commit accepted observations and release state
        run: |
          if [ -z "$(git status --porcelain -- data/consumer_intent_v1)" ]; then
            echo "No repository changes to commit."
            exit 0
          fi
          git config user.name "exmxc Consumer Intent"
          git config user.email "actions@users.noreply.github.com"
          git add data/consumer_intent_v1
          git commit -m "Collect Consumer Intent $(date -u +%F)"
          git push origin HEAD:main
      - name: Deploy today's promoted release
        if: steps.release.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
          sleep 30
          node scripts/live-acceptance.mjs
